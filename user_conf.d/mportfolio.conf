server{
    listen 80;
    server_name amandaleeanneschock.duckdns.org;

    if ($host = amandaleeanneschock.duckdns.org){
        return 301 https://$host$request_uri;
    }
}

server{
    listen 443 ssl;
    sever_name amandaleeanneschock.duckdns.org;

    location / {
        proxy_pass http://amandaleeanneschock.duckdns.org:500/;
    }
    
    #load certificate files
    ssl_certificate /etc/letsencrype/live/myportfolio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myportfolio/pivkey.pem;
    ssl_trusted_certificate /etc/letsencrype/live/myportfolio/chain.pem;
}