limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server{
    listen 80;
    server_name amandaleeanneschock.duckdns.org;

    if ($host = amandaleeanneschock.duckdns.org){
        return 301 https://$host$request_uri;
    }
}

server{
    listen 443 ssl;
    server_name amandaleeanneschock.duckdns.org;

    location / {
        proxy_pass http://myportfolio:5000/;
    }
    
    location /api/timeline_post/ {
        limit_req zone=api_limit burst=10 nodelay;

        limit_req_status 429;

         proxy_pass http://myportfolio:5000/;
    }

    location /api/timeline_post {
        limit_req zone=api_limit burst=10 nodelay;
    
        limit_req_status 429;

        proxy_pass http://myportfolio:5000;
    }
    # Load certificate files matching your domain directory
    ssl_certificate /etc/letsencrypt/live/amandaleeanneschock.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amandaleeanneschock.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/amandaleeanneschock.duckdns.org/chain.pem;
}
   